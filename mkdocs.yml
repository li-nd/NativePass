site_name: NativePass
site_description: Native macOS client for the Unix password manager pass
site_url: https://np.developer.pm/
repo_url: https://github.com/li-nd/NativePass
repo_name: li-nd/NativePass
copyright: Copyright &copy; 2026 Markus Lind

theme:
  name: material
  logo: logo.png
  favicon: logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Requirements: requirements.md
  - Setup: setup.md
  - Plugins: plugins.md
  - Usage:
      - Overview: usage.md
      - Search: search.md
      - Quick Access: quick-access.md
      - App Lock: app-lock.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/li-nd/NativePass
